<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Gradient for outer petals -->
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55a388" />
      <stop offset="50%" stop-color="#3d826a" />
      <stop offset="100%" stop-color="#2d6451" />
    </linearGradient>
    
    <!-- Gradient for inner petals -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ecba8" />
      <stop offset="100%" stop-color="#4a9b7b" />
    </linearGradient>

    <!-- Warm terracotta highlight -->
    <linearGradient id="warmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e08257" />
      <stop offset="60%" stop-color="#7ecba8" />
      <stop offset="100%" stop-color="#387760" />
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Succulent Emblem (Center at x=60, y=60) -->
  <g transform="translate(60, 60)" filter="url(#softGlow)">
    <!-- Layer 1: Outer Petals (Octagon / 8 petals) -->
    <g fill="url(#sageGrad)" stroke="#1a3b2f" stroke-width="1.5" stroke-linejoin="round">
      <path d="M 0 -46 C 14 -32 18 -18 0 0 C -18 -18 -14 -32 0 -46 Z" />
      <path d="M 0 46 C 14 32 18 18 0 0 C -18 18 -14 32 0 46 Z" />
      <path d="M 46 0 C 32 14 18 18 0 0 C 18 -18 32 -14 46 0 Z" />
      <path d="M -46 0 C -32 14 -18 18 0 0 C -18 -18 -32 -14 -46 0 Z" />
      <path d="M 32.5 -32.5 C 32.5 -12 21 -3 0 0 C 3 -21 12 -32.5 32.5 -32.5 Z" />
      <path d="M -32.5 -32.5 C -32.5 -12 -21 -3 0 0 C -3 -21 -12 -32.5 -32.5 -32.5 Z" />
      <path d="M 32.5 32.5 C 32.5 12 21 3 0 0 C 3 21 12 32.5 32.5 32.5 Z" />
      <path d="M -32.5 32.5 C -32.5 12 -21 3 0 0 C -3 21 -12 32.5 -32.5 32.5 Z" />
    </g>

    <!-- Layer 2: Mid Petals (Rotated 22.5 deg) -->
    <g transform="rotate(22.5)" fill="url(#warmGrad)" stroke="#1f4236" stroke-width="1.5">
      <path d="M 0 -34 C 11 -23 13 -13 0 0 C -13 -13 -11 -23 0 -34 Z" />
      <path d="M 0 34 C 11 23 13 13 0 0 C -13 13 -11 23 0 34 Z" />
      <path d="M 34 0 C 23 11 13 13 0 0 C 13 -13 23 -11 34 0 Z" />
      <path d="M -34 0 C -23 11 -13 13 0 0 C -13 -13 -23 -11 -34 0 Z" />
    </g>

    <!-- Layer 3: Inner Petals -->
    <g transform="rotate(45)" fill="url(#innerGrad)" stroke="#1b3f32" stroke-width="1.2">
      <path d="M 0 -22 C 8 -15 9 -8 0 0 C -9 -8 -8 -15 0 -22 Z" />
      <path d="M 0 22 C 8 15 9 8 0 0 C -9 8 -8 15 0 22 Z" />
      <path d="M 22 0 C 15 8 8 9 0 0 C 8 -9 15 -8 22 0 Z" />
      <path d="M -22 0 C -15 8 -8 9 0 0 C -8 -9 -15 -8 -22 0 Z" />
    </g>

    <!-- Center Bud -->
    <circle cx="0" cy="0" r="6" fill="#a4e4c3" stroke="#235442" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2.5" fill="#f09b75" />
  </g>

  <!-- Typography -->
  <g fill="#ffffff">
    <!-- Primary Brand Title -->
    <text x="132" y="55" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="3" text-anchor="start">
      SUCCULENT
    </text>
    
    <!-- Accent Secondary Word -->
    <text x="132" y="86" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="300" letter-spacing="8" fill="#7ecba8" text-anchor="start">
      OASIS
    </text>

    <!-- Subtle Tagline -->
    <text x="134" y="105" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="rgba(255,255,255,0.6)" text-anchor="start">
      BOUTIQUE PLANT STUDIO
    </text>
  </g>
</svg>
